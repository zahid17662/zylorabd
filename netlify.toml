[build]
  command = "npm run build"
  publish = "dist"

# Vite 8 / plugin-react 6 require Node ^20.19 or >=22.12; Netlify's default is older.
[build.environment]
  NODE_VERSION = "22"

# Proxy API calls to the Render backend so the browser uses same-origin /api/v1/... paths.
# Update the target if your Render service URL differs from the one in render.yaml (zylorabd-api).
[[redirects]]
  from = "/api/*"
  to = "https://zylorabd-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
